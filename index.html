<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA logotype" class="logo logo-wordmark" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Get Space Images</button>
      <img src="img/NASA-Logo-Large.jpg" alt="NASA insignia" class="logo logo-insignia" />
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal that displays a larger NASA image -->
<div id="imageModal" class="modal">

    <div class="modal-content">

        <!-- Button to close the modal -->
        <button id="closeModal" class="close-modal">&times;</button>

        <!-- Image information -->
        <h2 id="modalTitle"></h2>
        <p id="modalDate"></p>

        <!-- Larger image -->
        <img id="modalImage" alt="NASA astronomy photo">

        <!-- NASA explanation -->
        <p id="modalDescription"></p>

    </div>
</div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
